name: SentinelRisk CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Run Tests
      # Note: We skip verifying the DB file persistence in CI/CD as it depends on local volume
      # We focus on unit tests and API logic
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/src
        pytest tests/ -v
