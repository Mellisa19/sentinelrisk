services:
  # Backend API Service
  - type: web
    name: sentinelrisk-api
    env: python
    plan: free
    runtime: python3.11
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn src.services.api:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: 30
      - key: MODEL_PATH
        value: models/xgboost_fraud.pkl
      - key: PREPROCESSOR_PATH
        value: models/preprocessor.pkl
      - key: LOG_LEVEL
        value: INFO
      - key: DEBUG
        value: false

  # Frontend Service
  - type: web
    name: sentinelrisk-frontend
    env: static
    plan: free
    buildCommand: "cd app && npm install && npm run build"
    publishPath: app/dist
    envVars:
      - key: VITE_API_URL
        value: https://sentinelrisk-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # PostgreSQL Database
  - type: postgres
    name: sentinelrisk-db
    plan: free
    databaseName: sentinelrisk
    user: sentinel_user
    ipAllowList: []  # Only allow internal connections
